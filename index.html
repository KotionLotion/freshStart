<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fresh Start Inc. helps people find work, build resumes, and track their progress." />
    
    <title>Fresh Start Inc. | Your next chapter starts here</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Denk+One&family=Kavoon&family=Mogra&display=swap" rel="stylesheet">    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <div class="radar-background" id="radar-background" data-component-url="components/radar/radar.html" aria-hidden="true"></div>

    <div class="navbar-mount" data-navbar data-component-url="components/navbar/navbar.html"></div>
    <div data-component-url="components/accessibility/accessibility.html"></div>

    <main id="main-content">
      <section class="welcome" id="home" aria-labelledby="page-title">
        <h1 id="page-title">What do you need?</h1>
      </section>

      <section class="navigation-section" aria-label="Fresh Start actions" data-i18n-aria="freshStartActions">
        <div class="circle-navigation" id="circle-navigation">
          <a class="action action-resume" href="/pages/resumeBuilder/resumeBuilder.html" aria-label="Build my resume">
            <span class="action-content">
              <i class="action-icon bi bi-person-vcard" aria-hidden="true"></i>
              <svg class="action-label-curve" viewBox="0 0 100 100" aria-hidden="true">
                <defs><path id="resume-curve" d="M 16 100 A 84 84 0 0 1 100 16" /></defs>
                <text class="mogra-regular"><textPath href="#resume-curve" startOffset="50%" text-anchor="middle">Build my Resume</textPath></text>
              </svg>
            </span>
          </a>
          <a class="action action-find" href="/pages/findJob/findJob.html" aria-label="Find a job">
            <span class="action-content">
              <i class="action-icon bi bi-briefcase" aria-hidden="true"></i>
              <svg class="action-label-curve" viewBox="0 0 100 100" aria-hidden="true">
                <defs><path id="find-curve" d="M 0 16 A 84 84 0 0 1 84 100" /></defs>
                <text class="mogra-regular"><textPath href="#find-curve" startOffset="50%" text-anchor="middle">Find a Job</textPath></text>
              </svg>
            </span>
          </a>
          <a class="action action-apply" href="/pages/applyJob/applyJob.html" aria-label="Apply for a job">
            <span class="action-content">
              <i class="action-icon bi bi-send" aria-hidden="true"></i>
              <svg class="action-label-curve" viewBox="0 0 100 100" aria-hidden="true">
                <defs><path id="apply-curve" d="M 12 0 A 88 88 0 0 0 100 88" /></defs>
                <text class="mogra-regular"><textPath href="#apply-curve" startOffset="50%" text-anchor="middle">Apply for a Job</textPath></text>
              </svg>
            </span>
          </a>
          <a class="action action-applications" href="/pages/mySubmissions/mySubmissions.html" aria-label="My submitted applications">
            <span class="action-content">
              <i class="action-icon bi bi-clipboard-check" aria-hidden="true"></i>
              <svg class="action-label-curve" viewBox="0 0 100 100" aria-hidden="true">
                <defs><path id="applications-curve" d="M 0 88 A 88 88 0 0 0 88 0" /></defs>
                <text class="mogra-regular"><textPath href="#applications-curve" startOffset="50%" text-anchor="middle">Submitted Applications</textPath></text>
              </svg>
            </span>
          </a>
        </div>

        <div class="list-navigation" id="list-navigation" hidden>
          <a class="action-list action-resume" href="/pages/resumeBuilder/resumeBuilder.html"><i class="list-icon bi bi-person-vcard" aria-hidden="true"></i><span><strong>Build my resume</strong></span><span aria-hidden="true">→</span></a>
          <a class="action-list action-find" href="/pages/findJob/findJob.html"><i class="list-icon bi bi-briefcase" aria-hidden="true"></i><span><strong>Find a job</strong></span><span aria-hidden="true">→</span></a>
          <a class="action-list action-apply" href="/pages/applyJob/applyJob.html"><i class="list-icon bi bi-send" aria-hidden="true"></i><span><strong>Apply for a job</strong></span><span aria-hidden="true">→</span></a>
          <a class="action-list action-applications" href="/pages/mySubmissions/mySubmissions.html"><i class="list-icon bi bi-clipboard-check" aria-hidden="true"></i><span><strong>My applications</strong></span><span aria-hidden="true">→</span></a>
        </div>

        <button class="view-toggle" id="view-toggle" type="button" aria-pressed="false">
          <i class="view-toggle-icon bi bi-list-ul" aria-hidden="true"></i>
          <span class="view-toggle-label" data-i18n="viewToggleList">Browse as a list</span>
        </button>
      </section>
    </main>
  </body>
</html>

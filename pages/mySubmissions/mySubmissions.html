<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Completed submissions | Fresh Start Inc.</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="mS.css" />
    <script src="../../script.js" defer></script>
    <script src="mS.js" defer></script>
  </head>
  <body>
    <div class="navbar-mount" data-component-url="../../components/navbar/navbar.html"></div>
    <div data-component-url="../../components/accessibility/accessibility.html"></div>

    <main id="main-content">
      <section class="hero">
        <div class="wrap">
          <div class="hero-tools">
            <a class="link" href="/index.html">← Back to home</a>
            <span class="label">Your application history</span>
          </div>
          <p class="eyebrow">Completed submissions</p>
          <h1>Track your applied roles</h1>
          <p>Keep a clear record of the jobs you have applied for, when you sent them and which ones you may want to cancel.</p>
        </div>
      </section>

      <div id="listView" class="wrap">
        <div class="layout">
          <section class="panel" aria-labelledby="submission-heading">
            <div class="panel-header">
              <div>
                <p class="label">Your list</p>
                <h2 class="header-title" id="submission-heading">Applied jobs</h2>
              </div>
              <span class="count-badge" id="submissionCount">0</span>
            </div>
            <div id="submissionList" class="submission-list" aria-live="polite"></div>
          </section>

          <aside class="card" aria-labelledby="detail-heading">
            <div id="appDetail" aria-live="polite"></div>
          </aside>
        </div>
      </div>

      <div id="detailView" class="detail-view" hidden></div>
    </main>

    <footer class="footer">
      <strong>Keep going</strong>
      <span>Your submissions stay here until you cancel them.</span>
    </footer>
  </body>
</html>
